<text x="48" y="78" font-size="28" font-weight="800" fill="#fff">From record to intelligence</text><rect x="48" y="150" width="212" height="300" rx="22" fill="#0d2e52" stroke="#2a4f7c"/><circle cx="88" cy="196" r="20" fill="#00C2FF"/><text x="88" y="203" text-anchor="middle" font-size="19" font-weight="800" fill="#051528">1</text><text x="72" y="256" font-size="22" font-weight="800" fill="#fff">Capture</text><text x="72" y="292" font-size="15" fill="#c3d3e8">Steps, crew,</text><text x="72" y="316" font-size="15" fill="#c3d3e8">equipment and</text><text x="72" y="340" font-size="15" fill="#c3d3e8">issues, timestamped</text><path d="M264 300 h24 m-8 -8 l8 8 l-8 8" stroke="#00C2FF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="292" y="150" width="212" height="300" rx="22" fill="#0d2e52" stroke="#2a4f7c"/><circle cx="332" cy="196" r="20" fill="#00C2FF"/><text x="332" y="203" text-anchor="middle" font-size="19" font-weight="800" fill="#051528">2</text><text x="316" y="256" font-size="22" font-weight="800" fill="#fff">Understand</text><text x="316" y="292" font-size="15" fill="#c3d3e8">Health, delay cause</text><text x="316" y="316" font-size="15" fill="#c3d3e8">and readiness</text><path d="M508 300 h24 m-8 -8 l8 8 l-8 8" stroke="#00C2FF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="536" y="150" width="212" height="300" rx="22" fill="#0d2e52" stroke="#2a4f7c"/><circle cx="576" cy="196" r="20" fill="#00C2FF"/><text x="576" y="203" text-anchor="middle" font-size="19" font-weight="800" fill="#051528">3</text><text x="560" y="256" font-size="22" font-weight="800" fill="#fff">Improve</text><text x="560" y="292" font-size="15" fill="#c3d3e8">Patterns across</text><text x="560" y="316" font-size="15" fill="#c3d3e8">turns, stands and</text><text x="560" y="340" font-size="15" fill="#c3d3e8">shifts</text><text x="48" y="520" font-size="20" font-weight="700" fill="#fff">Know what happened on the ramp, 