<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Illustration of four operational risk signals" font-family="Inter,Segoe UI,Arial,sans-serif">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d2e52"/><stop offset="1" stop-color="#051528"/></linearGradient></defs>
<rect width="800" height="600" rx="28" fill="url(#bg)"/>
<text x="48" y="78" font-size="28" font-weight="800" fill="#fff">Health and risk</text><text x="48" y="106" font-size="16" fill="#9fb6d3">Signals from the work itself</text><rect x="48" y="140" width="344" height="170" rx="20" fill="#0d2e52" stroke="#2a4f7c"/><circle cx="92" cy="190" r="22" fill="#ffb400"/><text x="128" y="196" font-size="20" font-weight="800" fill="#fff">Late or stalled steps</text><text x="76" y="248" font-size="15" fill="#c3d3e8">Step open past the station window</text><rect x="408" y="140" width="344" height="170" rx="20" fill="#0d2e52" stroke="#2a4f7c"/><circle cx="452" cy="190" r="22" fill="#ff7a6b"/><text x="488" y="196" font-size="20" font-weight="800" fill="#fff">Equipment gaps</text><text x="436" y="248" font-size="15" fill="#c3d3e8">Tug not confirmed before pushback</text><rect x="48" y="330" width="344" height="170" rx="20" fill="#0d2e52" stroke="#2a4f7c"/><circle cx="92" cy="380" r="22" fill="#00C2FF"/><text x="128" y="386" font-size="20" font-weight="800" fill="#fff">Logged issues</text><text x="76" y="438" font-size="15" fill="#c3d3e8">Crew concern reaches the lead at once</text><rect x="408" y="330" width="344" height="170" rx="20" fill="#0d2e52" stroke="#2a4f7c"/><circle cx="452" cy="380" r="22" fill="#1E88FF"/><text x="488" y="386" font-size="20" font-weight="800" fill="#fff">Repeat patterns</text><text x="436" y="438" font-size="15" fill="#c3d3e8">Same cause on the same stand</text><rect x="48" y="520" width="704" height="2" fill="#2a4f7c"/><text x="48" y="552" font-size="15" fill="#c3d3e8">Thresholds set by your station. Health is shown per turn, not per person.</text>
<text x="776" y="580" text-anchor="end" font-size="13" fill="#7f9bbd">Illustration. Not a product screen.</text></svg>